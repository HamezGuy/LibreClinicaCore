services:
  libreclinica:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    # The image declares LibreClinica's file store and Tomcat's logs VOLUMEs.
    # Unnamed, every `docker compose down` left both behind as anonymous
    # volumes on the Docker disk and the next `up` started an empty file store
    # while the named database still pointed into the old one. Named, they
    # survive `down` together with the database; `docker compose down -v`
    # resets all three.
    volumes:
      - libreclinica-data:/usr/local/tomcat/libreclinica.data
      - libreclinica-logs:/usr/local/tomcat/logs
    develop:
      watch:
        # restart on config file changes
        - action: sync+restart
          path: ./docker/config
          target: /usr/local/tomcat/libreclinica.config

        # rebuild on source file changes
        - action: rebuild
          path: ./core

        - action: rebuild
          path: ./odm

        - action: rebuild
          path: ./web

        - action: rebuild
          path: ./ws

  db:
    image: docker.io/library/postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: libreclinica
    # A named volume: the image declares its data directory a VOLUME, and
    # without a name every `up` after a `down` made a new anonymous volume and
    # left the previous one dangling on the Docker disk. The development
    # database now survives `down`; `docker compose down -v` resets it.
    volumes:
      - db-data:/var/lib/postgresql/data

  smtp:
    image: docker.io/marlonb/mailcrab:v1.1.0
    ports:
      - "127.0.0.1:1080:1080"

volumes:
  db-data:
  libreclinica-data:
  libreclinica-logs:
